<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Training Program · Santa Fe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════ ปฏิทินอบรม Santa Fe ════════
   พื้นหลังเทาอ่อนเรียบ · ส้ม Santa Fe · ตัวหนังสือน้ำตาลเข้ม · ฟอนต์ Sarabun (เดียวกับระบบอื่นในฮับ)
   ข้อมูลอ่านจาก Google Sheet (ชีต1) เหมือนเดิม แก้ข้อมูลที่ชีต ไม่ต้องแก้หน้านี้ */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F6EEE3; --line:#EADFCF; --line-2:#DCCDB8;
  --ink:#2A1D14; --ink-2:#5B4636; --muted:#8C7765;
  --orange:#F26B1D; --orange-2:#FF8A3D; --orange-soft:#FFEBDD; --orange-ink:#B8470B;
  --green:#1E7B4A; --green-soft:#E6F4EC; --amber:#9A6700; --amber-soft:#FFF4D6;
  --red:#B42318; --red-soft:#FDECEA; --gray-soft:#F1ECE5;
  --shadow:0 1px 2px rgba(42,29,20,.05),0 10px 28px rgba(42,29,20,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,"Leelawadee UI",Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* ── หัวหน้า: โลโก้ | ชื่อ · แถบตัวเลขอยู่ในหัวเดียวกัน ── */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px clamp(16px,3vw,48px) 0}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:50px;width:auto;display:block;flex:none}
.brand .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
.brand h1{margin:0;font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand h1 small{display:block;font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:2px}
.brand .ver{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);align-self:center;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;padding-bottom:14px}
.stat{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#FAFAFB;display:flex;align-items:baseline;gap:9px}
.stat.s-up{background:var(--orange-soft);border-color:#F8D2B8}
.stat.s-done{background:var(--green-soft);border-color:#CBE6D6}
.stat b{font-size:24px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.3}
.stat.s-up b{color:var(--orange)} .stat.s-done b{color:var(--green)}

main{padding:18px clamp(16px,3vw,48px) 60px}

/* ── ตัวกรอง: แถบเดียว กลุ่มเป็นปุ่มสลับ + ช่องค้นหา ── */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:24px;position:sticky;top:8px;z-index:5;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 6px 20px rgba(17,24,39,.06)}
.chips{display:flex;gap:2px;background:#F1F2F4;border-radius:11px;padding:3px;flex:none}
.chip{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:38px;white-space:nowrap}
.chip.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12)}
.chip em{font-style:normal;font-weight:700;font-size:12px;color:var(--muted);margin-left:5px}
.chip.on em{color:var(--orange)}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;border:1px solid transparent;background:#F1F2F4;border-radius:11px;padding:9px 14px 9px 38px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;min-height:44px}
.search input:focus{background:#fff;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}

/* ── หัวแต่ละส่วน ── */
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.sec-h h2{margin:0;font-size:20px;font-weight:800}
.sec-h span{font-size:13.5px;color:var(--muted);font-weight:600}

/* ── กำลังจะมาถึง: ใบใหญ่ + วันที่เป็นปฏิทินฉีก ── */
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.up{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.cal{flex:none;width:78px;border-radius:14px;overflow:hidden;text-align:center;border:1px solid var(--line-2);background:var(--surface);align-self:flex-start}
.cal i{display:block;font-style:normal;background:var(--orange);color:#fff;font-size:12.5px;font-weight:800;padding:3px 0}
.cal b{display:block;font-size:32px;font-weight:800;line-height:1.15;padding-top:4px;font-variant-numeric:tabular-nums}
.cal small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;padding-bottom:6px}
.up-b{flex:1;min-width:0;display:flex;flex-direction:column}
.cd{align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--orange-ink);background:var(--orange-soft);border-radius:999px;padding:2px 10px}
.cd.today{background:var(--orange);color:#fff}
.up h3{margin:6px 0 2px;font-size:16.5px;line-height:1.4;font-weight:800}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.run{display:inline-flex;align-items:baseline;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:var(--surface);line-height:1.6}
.run b{font-size:13px;font-weight:800;color:var(--ink)}
.trn{display:flex;gap:7px;align-items:flex-start;margin-top:8px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.trn svg{flex:none;width:16px;height:16px;margin-top:2px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.trn span{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.trn i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.trn b{font-weight:700;color:var(--ink)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.line .tags,.line .trn{margin-top:4px}
.grp{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 8px;background:var(--gray-soft);color:var(--ink-2);line-height:1.7}
.grp.tm{background:#EAF0FB;color:#2F4E8C}
.grp.st{background:#FCEFE6;color:#9A4A12}
.dl{margin-top:auto;padding-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px;text-decoration:none;min-height:42px;border:1px solid transparent}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-pri{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff;box-shadow:0 4px 14px rgba(242,107,29,.28)}
.btn-line{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--orange);color:var(--orange-ink)}

/* ── อบรมแล้ว: ไทม์ไลน์รายเดือน ── */
.month{margin-bottom:18px}
.month-h{font-size:14px;font-weight:800;color:var(--ink-2);margin:0 2px 8px;display:flex;align-items:center;gap:10px}
.month-h::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.day{text-align:center;line-height:1.1}
.day b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.day small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.row h4{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.done{background:var(--green-soft);color:var(--green)}
.st.hold{background:var(--amber-soft);color:var(--amber)}
.st.cancel{background:var(--red-soft);color:var(--red)}
.st.up{background:var(--orange-soft);color:var(--orange-ink)}
.st.other{background:var(--gray-soft);color:var(--ink-2)}
.row .act{display:flex;align-items:center;gap:10px}
.row .btn{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}

/* ── ยังไม่กำหนดวัน: หลักสูตรละใบ รวมรุ่น ── */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.plan{background:var(--surface);border:1px dashed var(--line-2);border-radius:16px;padding:14px 16px}
.plan h4{margin:4px 0 8px;font-size:15px;font-weight:800;line-height:1.4}
.runs{display:flex;gap:6px;flex-wrap:wrap}
.runs span{font-size:12px;font-weight:700;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:6px;padding:0 8px;line-height:1.7}

.empty,.load{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);font-weight:600}
.err{background:var(--red-soft);border:1px solid #F5C9C4;color:var(--red);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:none}
.err.show{display:block}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}

/* ── มือถือ ── */
@media(max-width:720px){
  .top-in{padding:10px 16px 0}
  .brand{gap:14px}
  .brand img{height:36px}
  .brand .ver{display:none}
  .brand h1{font-size:21px}
  .brand h1 small{font-size:12.5px}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 0;padding-bottom:12px}
  .stat{flex-direction:column;align-items:center;gap:2px;padding:7px 4px 8px;text-align:center}
  .stat b{font-size:19px}
  .stat span{font-size:11px}
  main{padding:12px 12px 40px}
  .bar{flex-wrap:wrap;gap:6px;margin-bottom:18px;top:6px;padding:5px}
  .chips{width:100%;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:1 0 auto}
  .search{flex:1 1 100%}
  .ups{grid-template-columns:1fr}
  .up{padding:14px;gap:12px}
  .cal{width:64px}.cal b{font-size:26px}
  .row{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:11px 12px}
  .row .act{grid-column:2;justify-content:space-between}
}
</style>
</head>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/19H-TfJugEGEyFSIxmamPMCPf9g48UpiW_OTs2CTVoG0/gviz/tq?tqx=out:csv&sheet=%E0%B8%8A%E0%B8%B5%E0%B8%951";
const TH_MONTH = { "มกราคม":1,"กุมภาพันธ์":2,"มีนาคม":3,"เมษายน":4,"พฤษภาคม":5,"มิถุนายน":6,"กรกฎาคม":7,"สิงหาคม":8,"กันยายน":9,"ตุลาคม":10,"พฤศจิกายน":11,"ธันวาคม":12 };
const MON_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MON_SHORT = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));

function parseCSV(text){
  const rows = []; let f = '', row = [], q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (c === '"'){ if (q && text[i+1] === '"'){ f += '"'; i++; } else q = !q; }
    else if (c === ',' && !q){ row.push(f); f = ''; }
    else if ((c === '\n' || c === '\r') && !q){ if (f.length || row.length){ row.push(f); rows.push(row); } f = ''; row = []; if (c === '\r' && text[i+1] === '\n') i++; }
    else f += c;
  }
  if (f.length || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => (x || '').trim()));
}
/* วันที่ในชีตมีทั้ง ค.ศ. (2026) และ พ.ศ. (2569) ปนกัน · อ่านได้ทั้งคู่ แล้วแสดงเป็น พ.ศ. ทั้งหมด */
function parseThaiDate(s){
  const p = String(s || '').trim().split(/\s+/);
  if (p.length < 3) return null;
  const d = parseInt(p[0], 10), m = TH_MONTH[p[1]]; let y = parseInt(p[2], 10);
  if (!d || !m || !y) return null;
  if (y >= 2400) y -= 543;
  return new Date(y, m - 1, d);
}
/* สถานะจากชีต → ชนิด · ไม่มีวันที่ = ยังไม่กำหนดวัน */
function kindOf(r){
  const t = (r.status || '').toLowerCase();
  if (/ยกเลิก|cancel/.test(t)) return 'cancel';
  if (/เลื่อน|hold|พัก/.test(t)) return 'hold';
  if (!r.date) return 'plan';
  if (/เรียบร้อย|สำเร็จ|เสร็จ|done|completed/.test(t)) return 'done';
  const today = new Date(); today.setHours(0,0,0,0);
  return r.date >= today ? 'up' : 'done';
}
const ST_LABEL = { done:'อบรมเรียบร้อย', up:'กำลังจะมาถึง', hold:'เลื่อนออกไป', cancel:'ยกเลิก', plan:'ยังไม่กำหนดวัน' };
const grpCls = g => /manager/i.test(g) ? 'tm' : /staff/i.test(g) ? 'st' : '';
const beYear = d => d.getFullYear() + 543;
const DL_ICON = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

let ROWS = [], GROUP = '', Q = '';

function daysLeft(d){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function cdLabel(n){ return n === 0 ? 'วันนี้' : n === 1 ? 'พรุ่งนี้' : 'อีก ' + n + ' วัน'; }

function render(){
  const q = Q.trim().toLowerCase();
  const list = ROWS.filter(r => (!GROUP || r.group === GROUP) &&
    (!q || (r.course + ' ' + r.trainer + ' ' + r.group + ' ' + r.batch).toLowerCase().includes(q)));
  const up = list.filter(r => r.kind === 'up').sort((a, b) => a.date - b.date);
  const past = list.filter(r => r.date && r.kind !== 'up').sort((a, b) => b.date - a.date);
  const plan = list.filter(r => !r.date && r.kind !== 'cancel');

  /* ตัวเลขสรุปนับตามกลุ่มที่เลือก ไม่นับคำค้น */
  const scope = ROWS.filter(r => !GROUP || r.group === GROUP);
  const courses = new Set(scope.map(r => r.course)).size;
  $('#stats').innerHTML = `
    <div class="stat s-up"><b>${scope.filter(r => r.kind === 'up').length}</b><span>กำลังจะมาถึง</span></div>
    <div class="stat s-done"><b>${scope.filter(r => r.kind === 'done').length}</b><span>อบรมแล้ว</span></div>
    <div class="stat"><b>${scope.filter(r => r.kind === 'plan').length}</b><span>รอกำหนดวัน</span></div>
    <div class="stat"><b>${courses}</b><span>หลักสูตร</span></div>`;

  const groups = [...new Set(ROWS.map(r => r.group).filter(Boolean))].sort();
  $('#chips').innerHTML = [['', 'ทั้งหมด', ROWS.length], ...groups.map(g => [g, g, ROWS.filter(r => r.group === g).length])]
    .map(([v, n, c]) => `<button class="chip ${GROUP === v ? 'on' : ''}" data-g="${esc(v)}">${esc(n)}<em>${c}</em></button>`).join('');

  const dlBtn = (r, cls) => r.link ? `<a class="btn ${cls}" href="${esc(r.link)}" target="_blank" rel="noopener">${DL_ICON}ทะเบียนรายชื่อ</a>` : '';
  /* รุ่น = ป้ายตัวเลขคู่กับป้ายกลุ่ม · วิทยากร = บรรทัดของตัวเอง ชื่อทีละคน (ในชีตคั่นด้วย , ) */
  const tags = r => `<div class="tags"><span class="grp ${grpCls(r.group)}">${esc(r.group)}</span>${r.batch ? `<span class="run">รุ่น <b>${esc(r.batch)}</b></span>` : ''}</div>`;
  const trn = r => { const names = String(r.trainer || '').split(/\s*[,،、/]\s*/).filter(Boolean);
    return names.length ? `<div class="trn"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg><span><i>วิทยากร</i>${names.map(n => `<b>${esc(n)}</b>`).join('')}</span></div>` : ''; };

  let html = '';
  if (up.length) html += `<section class="sec"><div class="sec-h"><h2>กำลังจะมาถึง</h2><span>${up.length} รุ่น · เรียงวันใกล้สุดก่อน</span></div>
    <div class="ups">${up.map(r => { const n = daysLeft(r.date); return `<article class="up">
      <div class="cal"><i>${MON_SHORT[r.date.getMonth()]}</i><b>${r.date.getDate()}</b><small>${beYear(r.date)}</small></div>
      <div class="up-b"><span class="cd ${n === 0 ? 'today' : ''}">${cdLabel(n)}</span>
        <h3>${esc(r.course)}</h3>
        ${tags(r)}${trn(r)}
        ${r.link ? `<div class="dl">${dlBtn(r, 'btn-pri')}</div>` : ''}</div>
    </article>`; }).join('')}</div></section>`;

  if (past.length){
    const byMonth = {};
    past.forEach(r => { const k = r.date.getFullYear() * 100 + r.date.getMonth(); (byMonth[k] = byMonth[k] || []).push(r); });
    html += `<section class="sec"><div class="sec-h"><h2>อบรมแล้ว</h2><span>${past.length} รุ่น · ล่าสุดก่อน</span></div>
      ${Object.keys(byMonth).sort((a, b) => b - a).map(k => { const rs = byMonth[k], d = rs[0].date; return `<div class="month">
        <div class="month-h">${MON_FULL[d.getMonth()]} ${beYear(d)}</div>
        <div class="rows">${rs.map(r => `<div class="row">
          <div class="day"><b>${r.date.getDate()}</b><small>${MON_SHORT[r.date.getMonth()]}</small></div>
          <div><h4>${esc(r.course)}</h4><div class="line">${tags(r)}${trn(r)}</div></div>
          <div class="act"><span class="st ${r.kind}">${ST_LABEL[r.kind]}</span>${dlBtn(r, 'btn-line')}</div>
        </div>`).join('')}</div></div>`; }).join('')}</section>`;
  }

  if (plan.length){
    const byCourse = {};
    plan.forEach(r => { const k = r.group + '|' + r.course; (byCourse[k] = byCourse[k] || []).push(r); });
    html += `<section class="sec"><div class="sec-h"><h2>ยังไม่กำหนดวัน</h2><span>${Object.keys(byCourse).length} หลักสูตร · ${plan.length} รุ่น</span></div>
      <div class="plans">${Object.values(byCourse).map(rs => `<div class="plan">
        <span class="grp ${grpCls(rs[0].group)}">${esc(rs[0].group)}</span>
        <h4>${esc(rs[0].course)}</h4>
        <div class="runs">${rs.map(r => `<span>รุ่น ${esc(r.batch || '—')}</span>`).join('')}</div>
      </div>`).join('')}</div></section>`;
  }
  $('#view').innerHTML = html || '<div class="empty">ไม่พบหลักสูตรตามที่ค้นหา</div>';
}

document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  GROUP = c.dataset.g; render();
});
$('#q').addEventListener('input', e => { Q = e.target.value; render(); });

async function load(){
  try{
    const res = await fetch(CSV_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = parseCSV(await res.text());
    if (csv.length < 2) throw new Error('ชีตว่าง หรือยังไม่ได้เผยแพร่');
    const h = csv[0].map(x => x.toLowerCase());
    const col = (keys, def) => { const i = h.findIndex(x => keys.some(k => x.includes(k))); return i < 0 ? def : i; };
    const I = { group:col(['กลุ่ม','group'],0), course:col(['หลักสูตร','course'],1), batch:col(['รุ่น','batch'],2),
      trainer:col(['วิทยากร','trainer'],3), date:col(['วันที่','date'],4), status:col(['สถานะ','status'],5), link:col(['ทะเบียน','ลิงก์','link'],6) };
    ROWS = csv.slice(1).filter(r => (r[I.course] || '').trim()).map(r => {
      const o = { group:(r[I.group]||'').trim(), course:(r[I.course]||'').trim().replace(/\s+/g,' '), batch:(r[I.batch]||'').trim(),
        trainer:(r[I.trainer]||'').trim(), date:parseThaiDate(r[I.date]), status:(r[I.status]||'').trim(), link:(r[I.link]||'').trim() };
      o.kind = kindOf(o);
      return o;
    });
    render();
  } catch(e){
    $('#view').innerHTML = '';
    $('#err').className = 'err show';
    $('#err').innerHTML = '<b>โหลดข้อมูลไม่สำเร็จ</b> · ' + esc(e && e.message ? e.message : 'เชื่อมต่อไม่ได้') + ' · ลองรีเฟรชอีกครั้ง';
  }
}
load();
</script>
</body>
</html>
